name: Linux release package on fresh systems

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-24.04
    container: debian:bookworm
    timeout-minutes: 60
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git python3 build-essential cmake ninja-build pkg-config \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxfixes-dev libxss-dev libxtst-dev \
            libwayland-dev libxkbcommon-dev libegl1-mesa-dev libgl1-mesa-dev fonts-dejavu-core
      - uses: actions/checkout@v4
      - name: SDL3 pinned source
        run: |
          git clone --depth 1 --branch release-3.2.30 https://github.com/libsdl-org/SDL.git build-sdl-source
          cmake -S build-sdl-source -B build-sdl -G Ninja -DCMAKE_BUILD_TYPE=Release -DSDL_TESTS=OFF -DCMAKE_INSTALL_PREFIX="$PWD/build-sdl-install"
          cmake --build build-sdl --parallel 4
          cmake --install build-sdl
      - name: Build and test the Release package
        run: |
          python3 tools/build.py --compiler gcc --config Release --test --install build/package/Physim
          tar -czf build/Physim-linux-x86_64.tar.gz -C build/package Physim
          # The verification kit contains no Physim implementation or SDL headers.
          # All compiler inputs for its consumers come from the installed package.
          tar -czf build/linux-verification-kit.tar.gz tools/build.py tools/verify-native-sdk.py tools/sdk_probe.c tools/wait-window-manager.py app/utf8.manifest tests/test_linux_native_dialogs.py
      - name: Upload Release package
        uses: actions/upload-artifact@v4
        with:
          name: physim-linux-release-x86_64
          path: build/Physim-linux-x86_64.tar.gz
          if-no-files-found: error
      - name: Upload independent verification kit
        uses: actions/upload-artifact@v4
        with:
          name: linux-package-verification-kit
          path: build/linux-verification-kit.tar.gz
          if-no-files-found: error
      - name: Archive package build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-release-build-tests
          path: build/native/Release/test-results/**/results.json
          if-no-files-found: ignore

  installed:
    needs: package
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: debian:bookworm
            label: debian-12
          - image: ubuntu:24.04
            label: ubuntu-24.04
    container: ${{ matrix.image }}
    timeout-minutes: 45
    env:
      DEBIAN_FRONTEND: noninteractive
      SDL_VIDEODRIVER: x11
      LIBGL_ALWAYS_SOFTWARE: "1"
    steps:
      # This job deliberately has no checkout and installs no SDL development
      # package, CMake or Python modules. Python only drives the test harness.
      - name: Desktop runtime
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates \
            xvfb xauth x11-utils zenity fonts-dejavu-core libx11-6 libxext6 libxrandr2 libxcursor1 libxi6 \
            libxfixes3 libxss1 libxtst6 libwayland-client0 libwayland-cursor0 libwayland-egl1 \
            libxkbcommon0 libegl1 libgl1 libgl1-mesa-dri libdbus-1-3
      - uses: actions/download-artifact@v4
        with:
          name: physim-linux-release-x86_64
          path: downloads
      - uses: actions/download-artifact@v4
        with:
          name: linux-package-verification-kit
          path: downloads
      - name: Unpack and record the fresh environment
        run: |
          mkdir -p "Installed package ä" verifier evidence
          tar -xzf downloads/Physim-linux-x86_64.tar.gz -C "Installed package ä"
          tar -xzf downloads/linux-verification-kit.tar.gz -C verifier
          test ! -e src
          test ! -e verifier/src
          test ! -e /usr/include/SDL3
          if command -v cmake; then echo 'CMake must not be available in this test system'; exit 1; fi
          cat /etc/os-release > evidence/system.txt
          dpkg-query -W >> evidence/system.txt
          ldd "Installed package ä/Physim/bin/physim" > evidence/app-libraries.txt
          if grep -q 'not found' evidence/app-libraries.txt; then cat evidence/app-libraries.txt; exit 1; fi
      - name: Start the installed app without a compiler or Python
        run: |
          for tool in cc gcc clang python3; do
            if command -v "$tool"; then echo "Unexpected build tool: $tool"; exit 1; fi
          done
          export XDG_RUNTIME_DIR="$(mktemp -d)"
          xvfb-run -a -s '-screen 0 1920x1080x24' timeout 60 "Installed package ä/Physim/bin/physim" --smoke > evidence/app-start.log 2>&1
      - name: Project compiler and test harness
        run: |
          # Openbox itself depends on Python; install it only after the
          # package's independent startup check without Python has passed.
          apt-get install -y --no-install-recommends build-essential python3 openbox xdotool scrot
          gcc --version > evidence/compiler.txt
          dpkg-query -W >> evidence/compiler.txt
      - name: Verify relocated SDK and all nine GUI project workflows
        run: |
          export XDG_RUNTIME_DIR="$(mktemp -d)"
          xvfb-run -a -s '-screen 0 1920x1080x24' sh -c '
            openbox > evidence/openbox.log 2>&1 &
            python3 verifier/tools/wait-window-manager.py || exit 1
            python3 verifier/tools/verify-native-sdk.py --sdk "Installed package ä/Physim" --work evidence --compiler gcc --app-tests
          '
      - name: Verify native file and folder dialogs
        run: |
          export XDG_RUNTIME_DIR="$(mktemp -d)"
          xvfb-run -a -s '-screen 0 1920x1080x24' sh -c '
            openbox > evidence/native-dialog-openbox.log 2>&1 &
            python3 verifier/tools/wait-window-manager.py || exit 1
            python3 verifier/tests/test_linux_native_dialogs.py --app "Installed package ä/Physim/bin/physim" --work evidence
          '
      - name: Archive clean-system results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installed-linux-${{ matrix.label }}
          path: |
            evidence/system.txt
            evidence/compiler.txt
            evidence/app-start.log
            evidence/app-libraries.txt
            evidence/openbox.log
            evidence/native-dialog-openbox.log
            evidence/Native dialogs*/**
            evidence/Native SDK*/verification.log
            evidence/Native SDK*/PASSED.txt
            evidence/Native SDK*/App */*.bmp
          if-no-files-found: ignore
