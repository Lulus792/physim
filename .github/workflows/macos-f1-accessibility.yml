name: Focused macOS F1 accessibility
on:
  push:
    branches: [main, codex/mac-f1-reading, codex/mac-f1-fields, codex/mac-f1-links, codex/windows-link-stability]
    paths:
      - app/accessibility*
      - app/documentation*
      - app/ui*
      - app/graphics.*
      - app/main.c
      - app/settings_ui.inc
      - third_party/nuklear.h
      - tests/test_font_*.c
      - tests/test_documentation.c
      - tests/check_documentation_anchors.py
      - tests/documentation_anchor_probe.c
      - tests/test_accessibility*
      - tests/test_native_test_runner.py
      - tests/check_display_workflow.py
      - tests/native_integration_cases.json
      - tools/native_tests.py
      - tools/profile_font_prepare.py
      - tools/check_sidebar_counterexample.py
      - tools/check_detail_counterexample.py
      - .github/workflows/macos-f1-accessibility.yml
  workflow_dispatch:
concurrency:
  group: macos-f1-${{ github.ref }}
  cancel-in-progress: false
jobs:
  native-text:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    env:
      ASAN_OPTIONS: detect_leaks=0
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - uses: actions/checkout@v4
      - name: LLVM sanitizer linker
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: |
          brew install llvm@20 lld@20
          echo "$(brew --prefix llvm@20)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix lld@20)/bin" >> "$GITHUB_PATH"
      - name: SDL3 pinned source
        run: |
          git clone --depth 1 --branch release-3.2.30 https://github.com/libsdl-org/SDL.git build-sdl-source
          cmake -S build-sdl-source -B build-sdl -G Ninja -DCMAKE_BUILD_TYPE=Release -DSDL_TESTS=OFF -DCMAKE_INSTALL_PREFIX="$PWD/build-sdl-install"
          cmake --build build-sdl --parallel 4
          cmake --install build-sdl
      - name: Platform catalog and failure reporting
        run: python3 tests/test_native_test_runner.py --work build/native
      - name: Portable UTF-16 and document contracts
        run: python3 tools/build.py --compiler clang --sanitizers --test --test-filter accessibility_utf16 --test-filter accessibility_document --test-filter accessibility_tables --test-filter accessibility_suspend --test-filter accessibility_edit --test-filter font_atlas_limits --test-filter font_faces --test-filter font_sources --test-filter font_density --test-filter documentation --test-filter documentation_anchors
      - name: Actual AppKit and rendered F1
        run: python3 tools/build.py --compiler clang --sanitizers --test-display --test-filter accessibility_native --test-filter accessibility_ui --test-filter font_bank_ui --test-filter accessibility_document_macos --test-filter accessibility_edit_macos --test-filter accessibility_links_macos --test-filter documentation_detail --test-filter documentation_navigation --test-filter documentation_sidebar --test-filter graphics --test-filter documentation_font_demand --test-filter documentation_density --test-filter documentation_formula_narrow --test-filter documentation_formula_physics --test-filter documentation_formula_models --test-filter documentation_formula_models_narrow --test-filter documentation_formula_mechanics --test-filter documentation_formula_mechanics_narrow --test-filter documentation_formula_basics --test-filter documentation_formula_basics_narrow --test-filter documentation_formula_catalog --test-filter documentation_typeset --test-filter documentation_math --test-filter documentation_inline
      - name: Actual previous detail wrapping is rejected
        run: python3 tools/check_detail_counterexample.py --compiler clang --sdl "$PWD/build-sdl-install"
      - name: Actual previous sidebar layout is rejected
        run: python3 tools/check_sidebar_counterexample.py --compiler clang --sdl "$PWD/build-sdl-install"
      - name: Paired font preparation comparison after actual cold-start cases
        run: |
          mkdir -p build/native/font-prepare-baseline
          git fetch --no-tags --depth=1 origin e8042e4d4458f79f02acb8394e548613460693cb
          git show e8042e4d4458f79f02acb8394e548613460693cb:app/ui_backend.c > build/native/font-prepare-baseline/ui_backend.c
          python3 tools/profile_font_prepare.py --label macos-paired --compiler clang --sdl "$PWD/build-sdl-install" --compare-backend-source build/native/font-prepare-baseline/ui_backend.c
          python3 - <<'PY'
          from pathlib import Path
          import json
          report=json.loads(Path('build/native/font-prepare-macos-paired/report.json').read_text())
          print('Actual complete atlas bytes identical:',report['complete_atlas_bytes_identical'])
          print('Font source median seconds:',report['paired_before_median_seconds'],'->',report['median_sources_seconds'])
          PY
      - name: Archive focused evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-f1-${{ matrix.runner }}
          path: |
            build/native/Debug-sanitized/test-results/**
            build/native/sidebar-counterexample/**
            build/native/detail-counterexample/**
            build/native/font-prepare-macos-*/report.json
            build/native/font-prepare-macos-*/stdout
            build/native/font-prepare-macos-*/stderr
            build/native/font-prepare-macos-*/atlas*.a8
          if-no-files-found: error
