name: Native macOS editor menu workflows
on:
  push:
    branches: [main, codex/f1-design-h]
    paths:
      - app/native_menu*
      - app/main.c
      - app/document_tests.inc
      - app/completion*
      - app/signature_help*
      - app/signature_ui.inc
      - app/signature_tests.inc
      - app/syntax*
      - app/design_tokens.h
      - src/language/builtin_type_names.inc
      - src/language/lexer*
      - src/language/parser*
      - src/language/editor_*.h
      - app/c_bindings*
      - app/c_signatures*
      - app/c_lookup*
      - tests/test_c_lookup.c
      - tests/test_signature_help.c
      - tests/test_c_signatures.c
      - tests/test_editor_signatures.c
      - tests/test_module_signatures.c
      - tests/test_call_targets.c
      - tools/generate-completions.py
      - app/api_reference_tests.inc
      - tests/check_display_workflow.py
      - tests/native_integration_cases.json
      - tools/build.py
      - .github/workflows/macos-editor-menu.yml
  workflow_dispatch:
concurrency:
  group: native-editor-menu-${{ github.ref }}
  cancel-in-progress: false
jobs:
  editor:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: SDL cache identity
        id: sdl-identity
        run: echo "key=${RUNNER_OS}-${RUNNER_ARCH}-${ImageOS:-macos}-${ImageVersion:-unknown}-sdl-3.2.30-v1" >> "$GITHUB_OUTPUT"
      - name: Restore pinned SDL install
        id: sdl-cache
        uses: actions/cache/restore@v4
        with:
          path: build/sdl-install
          key: ${{ steps.sdl-identity.outputs.key }}
      - name: Pinned SDL3
        if: steps.sdl-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch release-3.2.30 https://github.com/libsdl-org/SDL.git build/sdl-source
          cmake -S build/sdl-source -B build/sdl-build -G Ninja -DCMAKE_BUILD_TYPE=Release -DSDL_TESTS=OFF -DCMAKE_INSTALL_PREFIX="$PWD/build/sdl-install"
          cmake --build build/sdl-build --parallel 4
          cmake --install build/sdl-build
      - name: Save pinned SDL install
        if: steps.sdl-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: build/sdl-install
          key: ${{ steps.sdl-identity.outputs.key }}
      - name: Actual signature, call-target and revision data
        run: python3 tools/build.py --compiler clang --config Release --jobs 4 --sdl "$PWD/build/sdl-install" --test --test-filter signature_help --test-filter c_lookup --test-filter module_signatures --test-filter c_signatures --test-filter editor_signatures --test-filter call_targets --test-filter c_call_context --test-filter completion_c_locals --test-filter completion_locals --test-filter completion_info
      - name: Actual document, completion and API reference workflows
        run: python3 tools/build.py --compiler clang --config Release --jobs 4 --sdl "$PWD/build/sdl-install" --test-display --test-filter documents_small --test-filter documents_large --test-filter completion_workflow --test-filter completion_automatic_workflow --test-filter completion_automatic_deadline_workflow --test-filter completion_info_workflow --test-filter completion_locals_workflow --test-filter signature_help_workflow --test-filter api_reference_workflow
      - name: Compact native results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-editor-menu-${{ matrix.runner }}
          path: |
            build/native/**/test-results/**/results.json
            build/native/**/test-results/**/junit.xml
          if-no-files-found: warn
          retention-days: 14
