name: Native macOS study and project menus
on:
  push:
    branches: [main, codex/f1-design-h]
    paths:
      - app/native_menu*
      - app/main.c
      - app/batch_tests.inc
      - app/series_tests.inc
      - app/project_settings_tests.inc
      - app/workspace_catalog_tests.inc
      - tests/check_display_workflow.py
      - tools/build.py
      - .github/workflows/macos-study-menu.yml
  workflow_dispatch:
concurrency:
  group: native-study-menu-${{ github.ref }}
  cancel-in-progress: false
jobs:
  studies:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: SDL cache identity
        id: sdl-identity
        run: echo "key=${RUNNER_OS}-${RUNNER_ARCH}-${ImageOS:-macos}-${ImageVersion:-unknown}-sdl-3.2.30-v1" >> "$GITHUB_OUTPUT"
      - name: Restore pinned SDL install
        id: sdl-cache
        uses: actions/cache/restore@v4
        with:
          path: build/sdl-install
          key: ${{ steps.sdl-identity.outputs.key }}
      - name: Pinned SDL3
        if: steps.sdl-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch release-3.2.30 https://github.com/libsdl-org/SDL.git build/sdl-source
          cmake -S build/sdl-source -B build/sdl-build -G Ninja -DCMAKE_BUILD_TYPE=Release -DSDL_TESTS=OFF -DCMAKE_INSTALL_PREFIX="$PWD/build/sdl-install"
          cmake --build build/sdl-build --parallel 4
          cmake --install build/sdl-build
      - name: Save pinned SDL install
        if: steps.sdl-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: build/sdl-install
          key: ${{ steps.sdl-identity.outputs.key }}
      - name: Actual Debug and Release build controls and named workspace transactions
        run: python3 tools/build.py --compiler clang --config Release --jobs 4 --sdl "$PWD/build/sdl-install" --test-display --test-filter build_controls_workflow --test-filter named_workspaces_workflow
      - name: Actual batch cancellation and C and Physim adaptive studies with declared units
        run: python3 tools/build.py --compiler clang --config Release --jobs 4 --sdl "$PWD/build/sdl-install" --test-display --test-filter batch_workflow --test-filter timed_series_workflow --test-filter parameter_units_workflow
      - name: Compact native results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-study-menu-${{ matrix.runner }}
          path: |
            build/native/**/test-results/**/results.json
            build/native/**/test-results/**/junit.xml
          if-no-files-found: warn
          retention-days: 14
