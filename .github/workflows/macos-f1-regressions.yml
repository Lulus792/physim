name: Focused macOS F1 regressions
on:
  push:
    branches: [main, codex/f1-design-h]
    paths:
      - app/main.c
      - app/native_menu_ui.inc
      - app/documentation_ui.inc
      - app/documentation_actions.inc
      - app/documentation_keyboard_tests.inc
      - app/documentation_h_tests.inc
      - tests/test_font_bank_ui.c
      - tests/test_font_sources.c
      - tools/check_native_doc_search_counterexample.py
      - tools/check_font_bank_state_counterexample.py
      - tests/check_display_workflow.py
      - tests/test_documentation_typography_metrics.py
      - .github/workflows/macos-f1-regressions.yml
  workflow_dispatch:
concurrency:
  group: f1-regressions-${{ github.ref }}
  cancel-in-progress: false
jobs:
  f1:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: SDL cache identity
        id: sdl-identity
        run: echo "key=${RUNNER_OS}-${RUNNER_ARCH}-${ImageOS:-macos}-${ImageVersion:-unknown}-sdl-3.2.30-v1" >> "$GITHUB_OUTPUT"
      - name: Restore pinned SDL install
        id: sdl-cache
        uses: actions/cache/restore@v4
        with:
          path: build/sdl-install
          key: ${{ steps.sdl-identity.outputs.key }}
      - name: Pinned SDL3
        if: steps.sdl-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch release-3.2.30 https://github.com/libsdl-org/SDL.git build/sdl-source
          cmake -S build/sdl-source -B build/sdl-build -G Ninja -DCMAKE_BUILD_TYPE=Release -DSDL_TESTS=OFF -DCMAKE_INSTALL_PREFIX="$PWD/build/sdl-install"
          cmake --build build/sdl-build --parallel 4
          cmake --install build/sdl-build
      - name: Save pinned SDL install
        if: steps.sdl-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: build/sdl-install
          key: ${{ steps.sdl-identity.outputs.key }}
      - name: Build the actual Release app and UI libraries
        run: python3 tools/build.py --compiler clang --config Release --jobs 4 --sdl "$PWD/build/sdl-install"
      - name: Strict H primary-font metrics and corrupted-cache counterexamples
        run: python3 tests/test_documentation_typography_metrics.py "$PWD/build/h-font-metric-fixtures"
      - name: Previous native Search handler is rejected by AppKit Cmd+F
        run: python3 tools/check_native_doc_search_counterexample.py --compiler clang --sdl "$PWD/build/sdl-install" --build-dir "$PWD/build/native/Release"
      - name: Lost texture binding and unpack state are rejected
        run: python3 tools/check_font_bank_state_counterexample.py --compiler clang --sdl "$PWD/build/sdl-install" --build-dir "$PWD/build/native/Release"
      - name: Portable font-source coverage including the Command glyph
        run: python3 tools/build.py --compiler clang --config Release --jobs 4 --sdl "$PWD/build/sdl-install" --test --test-filter font_sources
      - name: Actual repaired font, field and F1 workflows
        run: python3 tools/build.py --compiler clang --config Release --jobs 4 --sdl "$PWD/build/sdl-install" --test-display --test-filter font_bank_ui --test-filter documentation_math --test-filter accessibility_edit_macos --test-filter documentation_h --test-filter documentation_panes
      - name: Compact native results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f1-regressions-${{ matrix.runner }}
          path: |
            build/native/**/test-results/**/results.json
            build/native/**/test-results/**/junit.xml
            build/native/Release/native-search-counterexample/report.json
            build/native/Release/native-search-counterexample/stdout
            build/native/Release/native-search-counterexample/stderr
            build/native/Release/font-bank-state-counterexample/report.json
            build/native/Release/font-bank-state-counterexample/**/stderr
          if-no-files-found: warn
          retention-days: 14
