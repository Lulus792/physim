name: C17 build and validation
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      package_only:
        description: Build and validate the two macOS app packages only
        type: boolean
        default: false
jobs:
  macos:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    env:
      CC: clang
      PHYSIM_CC: clang
    steps:
      - uses: actions/checkout@v4
      - name: Direct libFuzzer campaign
        if: ${{ !inputs.package_only }}
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: |
          brew install llvm@20 lld@20
          PATH="$(brew --prefix lld@20)/bin:$PATH" python3 tools/build.py --fuzzer --compiler "$(brew --prefix llvm@20)/bin/clang"
          python3 tests/test_native_fuzzer.py --bin build/native/Debug-fuzzer/bin --work build/native
      - name: SDL3 pinned source
        run: |
          git clone --depth 1 --branch release-3.2.30 https://github.com/libsdl-org/SDL.git build-sdl-source
          cmake -S build-sdl-source -B build-sdl -G Ninja -DCMAKE_BUILD_TYPE=Release -DSDL_TESTS=OFF -DCMAKE_INSTALL_PREFIX="$PWD/build-sdl-install"
          cmake --build build-sdl --parallel
          cmake --install build-sdl
      - name: Direct compiler build without CMake for Physim
        if: ${{ !inputs.package_only }}
        run: |
          python3 tools/build.py --compiler clang --test
          python3 tests/test_bootstrap_build.py --compiler clang --work build/native
          python3 tests/test_native_test_runner.py --work build/native
          python3 tools/build.py --compiler clang
          build/native/Debug/bin/physim --self-test "$PWD/build/Native C ä" pendulum
          build/native/Debug/bin/physim --self-test "$PWD/build/Native Language ä" language_full
      - name: Native SDK package and relocation
        if: ${{ !inputs.package_only }}
        run: |
          python3 tools/build.py --compiler clang --install build/native/SDK
          python3 tools/verify-native-sdk.py --sdk build/native/SDK --work build/native --compiler clang --app-tests
          python3 tools/package-macos.py --sdk build/native/SDK --output "build/native/Moved App ä/Physim.app"
          "build/native/Moved App ä/Physim.app/Contents/MacOS/physim" --self-test "$PWD/build/native/Bundled C ä" pendulum
          "build/native/Moved App ä/Physim.app/Contents/MacOS/physim" --self-test "$PWD/build/native/Bundled Language ä" language_full
          ditto -c -k --sequesterRsrc --keepParent "build/native/Moved App ä/Physim.app" "build/Physim-native-${{ matrix.runner }}.zip"
      - name: Direct window and graphics tests
        if: ${{ !inputs.package_only }}
        run: python3 tools/build.py --compiler clang --test-display
      - name: Direct sanitizer tests
        if: ${{ !inputs.package_only }}
        run: |
          python3 tests/test_sanitizer_build.py --compiler clang --work build/native
          python3 tools/build.py --compiler clang --sanitizers --no-app --test
      - name: Archive native macOS package
        if: ${{ !cancelled() && !inputs.package_only }}
        uses: actions/upload-artifact@v4
        with:
          name: physim-native-${{ matrix.runner }}
          path: build/Physim-native-${{ matrix.runner }}.zip
          if-no-files-found: ignore
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DPHYSIM_GRAPHICS_TESTS=ON -DPHYSIM_BUILD_BENCHMARKS=ON -DCMAKE_PREFIX_PATH="$PWD/build-sdl-install"
      - name: Build
        id: macos_build
        run: |
          if [ "${{ inputs.package_only }}" = "true" ]; then
            cmake --build build --parallel --target physim physimc physim-runner physim-analysis-runner physim-batch pendulum projectile collision box_floor spring uncertain_projectile box_collision buoyancy pendulum_analysis
          else
            cmake --build build --parallel
          fi
      - name: Test
        if: ${{ !inputs.package_only }}
        run: ctest --test-dir build --output-on-failure -LE display
      - name: Relocated SDK and all templates
        if: ${{ !cancelled() && !inputs.package_only && steps.macos_build.outcome == 'success' }}
        run: cmake -DBUILD_DIR=build -DCONFIG=Debug -P tools/verify-sdk.cmake
      - name: GPU and window tests
        if: ${{ !cancelled() && !inputs.package_only && steps.macos_build.outcome == 'success' }}
        run: ctest --test-dir build --output-on-failure -L display
      - name: App workflow with paths containing spaces and Unicode
        if: ${{ !cancelled() && !inputs.package_only && steps.macos_build.outcome == 'success' }}
        run: |
          result=0
          for example in pendulum projectile collision box_floor spring uncertain_projectile box_collision buoyancy; do
            ./build/bin/physim --self-test "$PWD/build/App Test ä $example" "$example" || result=1
          done
          exit "$result"
      - name: Relocated macOS app bundle
        if: ${{ !cancelled() && steps.macos_build.outcome == 'success' }}
        run: |
          python3 tools/package-macos.py --build build --config Debug --output build/Physim.app
          mkdir -p "build/Moved Mac ä"
          mv build/Physim.app "build/Moved Mac ä/Physim.app"
          "build/Moved Mac ä/Physim.app/Contents/MacOS/physim" --self-test "$PWD/build/Bundled C ä" pendulum
          "build/Moved Mac ä/Physim.app/Contents/MacOS/physim" --self-test "$PWD/build/Bundled Language ä" language_full
          ditto -c -k --sequesterRsrc --keepParent "build/Moved Mac ä/Physim.app" "build/Physim-${{ matrix.runner }}.zip"
      - name: Archive macOS evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.runner }}
          path: |
            build/native/fuzzer run*/**
            build/native/sanitizer probe*/results.json
            build/native/*/test-results/**/results.json
            build/native/*/test-results/**/app-steps.json
            build/native/*/test-results/*/ui_rendering/**/measurements/**
            build/native/*/test-results/*/toolbar_*/**/*.bmp
            build/native-integrations/toolbar_*/**/*.bmp
            build/native/Native SDK*/verification.log
            build/native/Native SDK*/PASSED.txt
            build/SDK Test*/verification.log
            build/SDK Test*/PASSED.txt
            build/toolbar-*/*.bmp
            build/App Test*/*.bmp
            build/Bundled*/*.bmp
            build/Testing/Temporary/LastTest.log
          if-no-files-found: ignore
      - name: Archive tested macOS app
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: physim-app-${{ matrix.runner }}
          path: build/Physim-${{ matrix.runner }}.zip
          if-no-files-found: ignore
  windows:
    if: ${{ !inputs.package_only }}
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        toolset: [v143, ClangCL]
        configuration: [Debug, Release]
    steps:
      - uses: actions/checkout@v4
      - name: UI dependency
        shell: pwsh
        run: ./tools/bootstrap-windows.ps1
      - name: Direct libFuzzer campaign
        if: matrix.toolset == 'ClangCL' && matrix.configuration == 'Debug'
        shell: pwsh
        run: |
          python tools/build.py --fuzzer --compiler clang-cl
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python tests/test_native_fuzzer.py --bin build/native/Debug-fuzzer/bin --work build/native
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Direct compiler build without CMake for Physim
        shell: pwsh
        run: |
          $compiler = if ('${{ matrix.toolset }}' -eq 'ClangCL') { 'clang-cl' } else { 'cl' }
          python tools/build.py --compiler $compiler --config ${{ matrix.configuration }} --test
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python tests/test_bootstrap_build.py --compiler $compiler --work build/native
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python tests/test_native_test_runner.py --work build/native
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python tools/build.py --compiler $compiler --config ${{ matrix.configuration }}
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Native SDK package and relocation
        if: matrix.configuration == 'Release'
        shell: pwsh
        run: |
          $compiler = if ('${{ matrix.toolset }}' -eq 'ClangCL') { 'clang-cl' } else { 'cl' }
          python tools/build.py --compiler $compiler --config Release --install build/native/SDK
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python tools/verify-native-sdk.py --sdk build/native/SDK --work build/native --compiler $compiler
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Compress-Archive -Path build/native/SDK -DestinationPath build/Physim-native-windows-${{ matrix.toolset }}.zip
      - name: Archive native Windows package
        if: ${{ !cancelled() && matrix.configuration == 'Release' }}
        uses: actions/upload-artifact@v4
        with:
          name: physim-native-windows-${{ matrix.toolset }}
          path: build/Physim-native-windows-${{ matrix.toolset }}.zip
          if-no-files-found: ignore
      - name: Direct sanitizer tests
        if: matrix.configuration == 'Debug'
        shell: pwsh
        run: |
          $compiler = if ('${{ matrix.toolset }}' -eq 'ClangCL') { 'clang-cl' } else { 'cl' }
          python tests/test_sanitizer_build.py --compiler $compiler --work build/native
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python tools/build.py --compiler $compiler --sanitizers --no-app --test --test-filter 'memory*' --test-filter core --test-filter report --test-filter run_mutations --test-filter protocol_mutations --test-filter 'language_native_memory_*'
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Configure
        run: cmake -S . -B build -A x64 -T ${{ matrix.toolset }} -DPHYSIM_BUILD_BENCHMARKS=ON
      - name: Build
        run: cmake --build build --config ${{ matrix.configuration }} --parallel
      - name: Test
        run: ctest --test-dir build -C ${{ matrix.configuration }} --output-on-failure
      - name: Relocated SDK and all templates
        run: cmake -DBUILD_DIR=build -DCONFIG=${{ matrix.configuration }} -P tools/verify-sdk.cmake
      - name: Archive SDK verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sdk-windows-${{ matrix.toolset }}-${{ matrix.configuration }}
          path: |
            build/native/fuzzer run*/**
            build/native/sanitizer probe*/results.json
            build/native/*/test-results/**/results.json
            build/native/*/test-results/**/app-steps.json
            build/native/*/test-results/*/ui_rendering/**/measurements/**
            build/native/*/test-results/*/toolbar_*/**/*.bmp
            build/native-integrations/toolbar_*/**/*.bmp
            build/native/Native SDK*/verification.log
            build/native/Native SDK*/PASSED.txt
            build/SDK Test*/verification.log
            build/SDK Test*/PASSED.txt
          if-no-files-found: ignore
      - name: Record verified Release workloads
        if: matrix.toolset == 'v143' && matrix.configuration == 'Release'
        run: python tools/benchmark.py build/bin/physim-benchmark.exe --output build/benchmark-results --samples 100000 --repeats 5
      - name: Archive performance evidence
        if: always() && matrix.toolset == 'v143' && matrix.configuration == 'Release'
        uses: actions/upload-artifact@v4
        with:
          name: windows-release-benchmark
          path: build/benchmark-results
          if-no-files-found: ignore
      # GPU tests run locally on Windows with PHYSIM_GRAPHICS_TESTS=ON.
      # The hosted Windows worker has no guaranteed OpenGL 3.3 driver.
  linux:
    if: ${{ !inputs.package_only }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    env:
      CC: ${{ matrix.compiler }}
      PHYSIM_CC: ${{ matrix.compiler }}
    steps:
      - uses: actions/checkout@v4
      - name: Platform dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxfixes-dev libxss-dev libxtst-dev libwayland-dev libxkbcommon-dev libegl1-mesa-dev libgl1-mesa-dev xvfb openbox x11-utils
      - name: Direct libFuzzer campaign
        if: matrix.compiler == 'clang'
        run: |
          python3 tools/build.py --fuzzer --compiler clang
          python3 tests/test_native_fuzzer.py --bin build/native/Debug-fuzzer/bin --work build/native
      - name: SDL3 pinned source
        run: |
          git clone --depth 1 --branch release-3.2.30 https://github.com/libsdl-org/SDL.git build-sdl-source
          cmake -S build-sdl-source -B build-sdl -G Ninja -DCMAKE_BUILD_TYPE=Release -DSDL_TESTS=OFF -DCMAKE_INSTALL_PREFIX="$PWD/build-sdl-install"
          cmake --build build-sdl --parallel
          cmake --install build-sdl
      - name: Direct compiler build without CMake for Physim
        run: |
          python3 tools/build.py --compiler "${{ matrix.compiler }}" --test
          python3 tests/test_bootstrap_build.py --compiler "${{ matrix.compiler }}" --work build/native
          python3 tests/test_native_test_runner.py --work build/native
          python3 tools/build.py --compiler "${{ matrix.compiler }}"
          xvfb-run -a build/native/Debug/bin/physim --self-test "$PWD/build/Native C ä" pendulum
          xvfb-run -a build/native/Debug/bin/physim --self-test "$PWD/build/Native Language ä" language_full
      - name: Native SDK package and relocation
        run: |
          python3 tools/build.py --compiler "${{ matrix.compiler }}" --install build/native/SDK
          xvfb-run -a python3 tools/verify-native-sdk.py --sdk build/native/SDK --work build/native --compiler "${{ matrix.compiler }}" --app-tests
          tar -czf "build/Physim-native-linux-${{ matrix.compiler }}.tar.gz" -C build/native SDK
      - name: Direct window and graphics tests
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: xvfb-run -a -s '-screen 0 1920x1080x24' sh -c 'openbox > build/native-openbox.log 2>&1 & python3 tools/wait-window-manager.py && python3 tools/build.py --compiler "${{ matrix.compiler }}" --test-display'
      - name: Direct sanitizer tests
        run: |
          python3 tests/test_sanitizer_build.py --compiler "${{ matrix.compiler }}" --work build/native
          python3 tools/build.py --compiler "${{ matrix.compiler }}" --sanitizers --test
      - name: Direct sanitizer window and graphics tests
        env:
          # SDL/Mesa retain process-wide allocations; keep leak checks enabled
          # for the separate non-window suite above.
          ASAN_OPTIONS: detect_leaks=0
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: xvfb-run -a -s '-screen 0 1920x1080x24' sh -c 'openbox > build/native-sanitizer-openbox.log 2>&1 & python3 tools/wait-window-manager.py && python3 tools/build.py --compiler "${{ matrix.compiler }}" --sanitizers --test-display'
      - name: Archive native Linux package
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: physim-native-linux-${{ matrix.compiler }}
          path: build/Physim-native-linux-${{ matrix.compiler }}.tar.gz
          if-no-files-found: ignore
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DPHYSIM_SANITIZERS=ON -DPHYSIM_GRAPHICS_TESTS=ON -DPHYSIM_BUILD_BENCHMARKS=ON -DCMAKE_PREFIX_PATH="$PWD/build-sdl-install"
      - name: Build
        id: linux_build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure -LE display
      - name: Relocated SDK and all templates
        if: ${{ !cancelled() && steps.linux_build.outcome == 'success' }}
        run: cmake -DBUILD_DIR=build -DCONFIG=Debug -P tools/verify-sdk.cmake
      - name: Archive SDK verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sdk-linux-${{ matrix.compiler }}
          path: |
            build/SDK Test*/verification.log
            build/SDK Test*/PASSED.txt
          if-no-files-found: ignore
      - name: GPU and window tests
        if: ${{ !cancelled() && steps.linux_build.outcome == 'success' }}
        env:
          ASAN_OPTIONS: detect_leaks=0
          LIBGL_ALWAYS_SOFTWARE: "1"
        # A window manager is needed for the real maximize/restore workflow.
        run: xvfb-run -a -s '-screen 0 1920x1080x24' sh -c 'openbox > /tmp/physim-openbox.log 2>&1 & ctest --test-dir build --output-on-failure -L display'
      - name: App workflow with paths containing spaces and Unicode
        if: ${{ !cancelled() && steps.linux_build.outcome == 'success' }}
        env:
          ASAN_OPTIONS: detect_leaks=0
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          xvfb-run -a -s '-screen 0 1920x1080x24' bash -c '
            openbox > /tmp/physim-app-openbox.log 2>&1 &
            result=0
            for example in pendulum projectile collision box_floor spring uncertain_projectile box_collision buoyancy; do
              ./build/bin/physim --self-test "$PWD/build/App Test ä $example" "$example" || result=1
            done
            exit "$result"
          '
      - name: Archive Linux UI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-ui-${{ matrix.compiler }}
          path: |
            build/native/fuzzer run*/**
            build/native-openbox.log
            build/native-sanitizer-openbox.log
            build/native/sanitizer probe*/results.json
            build/native/*/test-results/**/results.json
            build/native/*/test-results/**/app-steps.json
            build/native/*/test-results/*/ui_rendering/**/measurements/**
            build/native/*/test-results/*/toolbar_*/**/*.bmp
            build/native-integrations/toolbar_*/**/*.bmp
            build/native/Native SDK*/verification.log
            build/native/Native SDK*/PASSED.txt
            build/toolbar-*/*.bmp
            build/App Test*/*.bmp
            build/Testing/Temporary/LastTest.log
          if-no-files-found: ignore
